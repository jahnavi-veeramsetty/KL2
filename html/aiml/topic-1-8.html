<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands-On Exercise: Create a Virtual Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-page text-body font-sans antialiased relative">
  
  <div class="max-w-4xl mx-auto px-8 py-12 relative pt-20">
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="absolute top-6 right-8 p-2 rounded-xl bg-raised border border-line text-subtle hover:text-strong hover:border-line-strong transition-colors flex items-center justify-center shadow-sm">
      <svg id="moon-icon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg id="sun-icon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  
    <h1 class="text-3xl font-bold text-strong mb-8 border-b border-line pb-4">Hands-On Exercise: Create a Virtual Environment</h1>
    
          <div class="mb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-strong tracking-tight mb-4">Hands-On Exercise: Create a Virtual Environment and Install External Packages</h1>
            
          </div>
        <div class="space-y-6 text-body">
</div>

  </div>

  <script>
    // --- Theme Toggle Logic ---
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('theme-toggle');
    const moonIcon = document.getElementById('moon-icon');
    const sunIcon = document.getElementById('sun-icon');
    
    // Read theme from localStorage or system preference
    let currentTheme = localStorage.getItem('theme');
    if (!currentTheme) {
      currentTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    
    // Function to apply theme
    const applyTheme = (theme) => {
      htmlElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (theme === 'dark') {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        moonIcon.classList.remove('hidden');
        sunIcon.classList.add('hidden');
      }
    };
    
    // Initialize theme
    applyTheme(currentTheme);
    
    // Toggle on click
    themeToggleBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(currentTheme);
    });

    // --- Copy Code Logic ---
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.closest('.rounded-2xl').querySelector('.code-content').innerText;
        navigator.clipboard.writeText(code).then(() => {
          const copyIcon = btn.querySelector('.copy-icon');
          const checkIcon = btn.querySelector('.check-icon');
          const copyText = btn.querySelector('.copy-text');
          const checkText = btn.querySelector('.check-text');
          
          copyIcon.classList.add('hidden');
          copyText.classList.add('hidden');
          checkIcon.classList.remove('hidden');
          checkText.classList.remove('hidden');
          
          setTimeout(() => {
            copyIcon.classList.remove('hidden');
            copyText.classList.remove('hidden');
            checkIcon.classList.add('hidden');
            checkText.classList.add('hidden');
          }, 2000);
        });
      });
    });
  </script>
</body>
</html>
